name: tests

on:
  push:
    branches-ignore:
      - production
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull backend image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/clapp_backend:latest

      - name: Start Django backend
        run: |
          docker run -d \
            --name django-backend \
            -p 8000:8000 \
            -e DJANGO_SETTINGS_MODULE=conf.settings.test \
            --entrypoint /bin/bash \
            ${{ secrets.DOCKER_USERNAME }}/clapp_backend:latest \
            -c "python manage.py migrate && python manage.py create_test_user && python manage.py runserver 0.0.0.0:8000"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Show Django logs on failure
        if: failure()
        run: docker logs django-backend
